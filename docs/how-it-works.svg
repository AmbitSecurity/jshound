<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
<defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7394"/></marker><marker id="head2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6b7394"/></marker></defs>
<rect width="1200" height="610" rx="10" fill="#16181d"/>
<rect x="30" y="28" width="255" height="212" rx="8" fill="#1f222a" stroke="#2a2e38"/>
<text x="48.0" y="60.0" fill="#7aa2f7" font-size="16" font-weight="bold" xml:space="preserve" textLength="96.0" lengthAdjust="spacingAndGlyphs">1  Collect</text>
<text x="48.0" y="92.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">•</text>
<text x="64.0" y="92.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="168.0" lengthAdjust="spacingAndGlyphs">the page you give it</text>
<text x="48.0" y="119.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">•</text>
<text x="64.0" y="119.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="184.8" lengthAdjust="spacingAndGlyphs">every script it loads,</text>
<text x="64.0" y="140.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="92.4" lengthAdjust="spacingAndGlyphs">on any host</text>
<text x="48.0" y="167.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">•</text>
<text x="64.0" y="167.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="201.6" lengthAdjust="spacingAndGlyphs">lazy chunks and imports,</text>
<text x="64.0" y="188.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="201.6" lengthAdjust="spacingAndGlyphs">round after round, until</text>
<text x="64.0" y="209.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="168.0" lengthAdjust="spacingAndGlyphs">nothing new turns up</text>
<line x1="291" y1="134.0" x2="317" y2="134.0" stroke="#6b7394" stroke-width="2" marker-end="url(#head)"/>
<rect x="325" y="28" width="255" height="212" rx="8" fill="#1f222a" stroke="#2a2e38"/>
<text x="343.0" y="60.0" fill="#7aa2f7" font-size="16" font-weight="bold" xml:space="preserve" textLength="76.8" lengthAdjust="spacingAndGlyphs">2  Parse</text>
<text x="343.0" y="92.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">•</text>
<text x="359.0" y="92.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="193.2" lengthAdjust="spacingAndGlyphs">every file, with Babel;</text>
<text x="359.0" y="113.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="193.2" lengthAdjust="spacingAndGlyphs">nothing it ships is run</text>
<text x="343.0" y="140.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">•</text>
<text x="359.0" y="140.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="193.2" lengthAdjust="spacingAndGlyphs">each place a request is</text>
<text x="359.0" y="161.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="201.6" lengthAdjust="spacingAndGlyphs">made: fetch, XHR, axios,</text>
<text x="359.0" y="182.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="210.0" lengthAdjust="spacingAndGlyphs">API clients, GraphQL, RPC</text>
<line x1="586" y1="134.0" x2="612" y2="134.0" stroke="#6b7394" stroke-width="2" marker-end="url(#head)"/>
<rect x="620" y="28" width="255" height="212" rx="8" fill="#1f222a" stroke="#2a2e38"/>
<text x="638.0" y="60.0" fill="#7aa2f7" font-size="16" font-weight="bold" xml:space="preserve" textLength="76.8" lengthAdjust="spacingAndGlyphs">3  Trace</text>
<text x="638.0" y="92.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">•</text>
<text x="654.0" y="92.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="176.4" lengthAdjust="spacingAndGlyphs">each argument back to</text>
<text x="654.0" y="113.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="151.2" lengthAdjust="spacingAndGlyphs">its value, through</text>
<text x="654.0" y="134.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="184.8" lengthAdjust="spacingAndGlyphs">variables, imports and</text>
<text x="654.0" y="155.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="109.2" lengthAdjust="spacingAndGlyphs">other modules</text>
<text x="638.0" y="182.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">•</text>
<text x="654.0" y="182.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="193.2" lengthAdjust="spacingAndGlyphs">what cannot be resolved</text>
<text x="654.0" y="203.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="218.4" lengthAdjust="spacingAndGlyphs">stays as the code wrote it</text>
<line x1="881" y1="134.0" x2="907" y2="134.0" stroke="#6b7394" stroke-width="2" marker-end="url(#head)"/>
<rect x="915" y="28" width="255" height="212" rx="8" fill="#1f222a" stroke="#2a2e38"/>
<text x="933.0" y="60.0" fill="#7aa2f7" font-size="16" font-weight="bold" xml:space="preserve" textLength="76.8" lengthAdjust="spacingAndGlyphs">4  Write</text>
<text x="933.0" y="92.0" fill="#9ece6a" font-size="14" xml:space="preserve" textLength="109.2" lengthAdjust="spacingAndGlyphs">endpoints.txt</text>
<text x="933.0" y="113.0" fill="#9ece6a" font-size="14" xml:space="preserve" textLength="117.6" lengthAdjust="spacingAndGlyphs">requests.jsonl</text>
<text x="933.0" y="134.0" fill="#9ece6a" font-size="14" xml:space="preserve" textLength="100.8" lengthAdjust="spacingAndGlyphs">openapi.json</text>
<text x="933.0" y="155.0" fill="#9ece6a" font-size="14" xml:space="preserve" textLength="67.2" lengthAdjust="spacingAndGlyphs">urls.txt</text>
<rect x="30" y="272" width="1140" height="310" rx="8" fill="#16181d" stroke="#2a2e38"/>
<text x="52.0" y="306.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="344.4" lengthAdjust="spacingAndGlyphs">One request, traced through three modules</text>
<rect x="42" y="330" width="1080" height="40" rx="8" fill="#1f222a" stroke="#2a2e38"/>
<text x="52.0" y="356.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="75.6" lengthAdjust="spacingAndGlyphs">config.js</text>
<text x="190.0" y="356.0" fill="#bb9af7" font-size="14" xml:space="preserve" textLength="109.2" lengthAdjust="spacingAndGlyphs">export const </text>
<text x="299.2" y="356.0" fill="#e0af68" font-size="14" xml:space="preserve" textLength="58.8" lengthAdjust="spacingAndGlyphs">API_URL</text>
<text x="358.0" y="356.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="25.2" lengthAdjust="spacingAndGlyphs"> = </text>
<text x="383.2" y="356.0" fill="#9ece6a" font-size="14" xml:space="preserve" textLength="176.4" lengthAdjust="spacingAndGlyphs">"https://api.acme.io"</text>
<text x="559.6" y="356.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="8.4" lengthAdjust="spacingAndGlyphs">;</text>
<rect x="42" y="388" width="1080" height="40" rx="8" fill="#1f222a" stroke="#2a2e38"/>
<text x="52.0" y="414.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="75.6" lengthAdjust="spacingAndGlyphs">client.js</text>
<text x="190.0" y="414.0" fill="#bb9af7" font-size="14" xml:space="preserve" textLength="109.2" lengthAdjust="spacingAndGlyphs">export const </text>
<text x="299.2" y="414.0" fill="#7dcfff" font-size="14" xml:space="preserve" textLength="25.2" lengthAdjust="spacingAndGlyphs">api</text>
<text x="324.4" y="414.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="226.8" lengthAdjust="spacingAndGlyphs"> = axios.create({ baseURL: </text>
<text x="551.2" y="414.0" fill="#e0af68" font-size="14" xml:space="preserve" textLength="58.8" lengthAdjust="spacingAndGlyphs">API_URL</text>
<text x="610.0" y="414.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="33.6" lengthAdjust="spacingAndGlyphs"> });</text>
<rect x="42" y="446" width="1080" height="40" rx="8" fill="#1f222a" stroke="#2a2e38"/>
<text x="52.0" y="472.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="84.0" lengthAdjust="spacingAndGlyphs">invites.js</text>
<text x="190.0" y="472.0" fill="#7dcfff" font-size="14" xml:space="preserve" textLength="25.2" lengthAdjust="spacingAndGlyphs">api</text>
<text x="215.2" y="472.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="126.0" lengthAdjust="spacingAndGlyphs">.post(`/orgs/${</text>
<text x="341.2" y="472.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="42.0" lengthAdjust="spacingAndGlyphs">orgId</text>
<text x="383.2" y="472.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="226.8" lengthAdjust="spacingAndGlyphs">}/invites`, { email, role: </text>
<text x="610.0" y="472.0" fill="#9ece6a" font-size="14" xml:space="preserve" textLength="67.2" lengthAdjust="spacingAndGlyphs">"member"</text>
<text x="677.2" y="472.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="25.2" lengthAdjust="spacingAndGlyphs"> })</text>
<path d="M328.6 362 C328.6 386 580.6 370 580.6 392" fill="none" stroke="#e0af68" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#head2)"/>
<path d="M311.8 420 C311.8 444 202.6 428 202.6 450" fill="none" stroke="#7dcfff" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#head2)"/>
<text x="52.0" y="522.0" fill="#6b7394" font-size="14" xml:space="preserve" textLength="58.8" lengthAdjust="spacingAndGlyphs">jshound</text>
<text x="190.0" y="522.0" fill="#7aa2f7" font-size="14" xml:space="preserve" textLength="42.0" lengthAdjust="spacingAndGlyphs">POST </text>
<text x="232.0" y="522.0" fill="#e0af68" font-size="14" xml:space="preserve" textLength="159.6" lengthAdjust="spacingAndGlyphs">https://api.acme.io</text>
<text x="391.6" y="522.0" fill="#c0caf5" font-size="14" xml:space="preserve" textLength="226.8" lengthAdjust="spacingAndGlyphs">/orgs/{param_orgId}/invites</text>
<text x="190.0" y="546.0" fill="#9ece6a" font-size="14" xml:space="preserve" textLength="327.6" lengthAdjust="spacingAndGlyphs">{"email":"input:email","role":"string"}</text>
</svg>
