[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jshound"
version = "0.1.0"
description = "Recover a SPA's API from its JavaScript bundle: full requests, not just URLs."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["security", "recon", "reconnaissance", "pentest", "bug-bounty", "javascript", "webpack", "vite",
            "spa", "api", "endpoint-discovery", "openapi", "graphql", "burp", "caido"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: JavaScript",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
# curl_cffi is what gets jshound past bot defences that refuse a plain HTTP client. Optional, a
# `pipx install jshound` with no extras would quietly fall back to urllib and be refused far more.
dependencies = ["curl_cffi>=0.16.3"]

[project.urls]
Homepage = "https://github.com/AmbitSecurity/jshound"
Source = "https://github.com/AmbitSecurity/jshound"
Issues = "https://github.com/AmbitSecurity/jshound/issues"

[project.optional-dependencies]
# 0.16.3's Chrome 150 got into claude.ai 11 times in 12 on 2026-10-09, where 0.14's Chrome 142 was
# challenged every time. See the profile notes in fetch.py.
fetch = ["curl_cffi>=0.16.3"]

[project.scripts]
jshound = "jshound.cli:main"

[tool.setuptools]
packages = ["jshound", "jshound.export"]

[tool.setuptools.package-data]
jshound = ["js/*.js"]
